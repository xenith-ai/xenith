[build]
  command = "npm run build"
  publish = "dist/xenith"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: serve index.html for client routes so direct URLs and refresh work
[[redirects]]
  from = "/chat/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/chat"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
  Cross-Origin-Opener-Policy = "same-origin"
  Cross-Origin-Embedder-Policy = "require-corp"
