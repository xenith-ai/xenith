<div
  *ngIf="isOpen"
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
>
  <div class="dialog-container" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h2>Add Assistant</h2>
      <button class="close-button" (click)="closeDialog()">×</button>
    </div>

    <div class="dialog-content">
      <form (ngSubmit)="createAssistant()">
        <div class="form-group">
          <label for="assistant-name">Assistant Name</label>
          <input
            id="assistant-name"
            type="text"
            [(ngModel)]="assistantName"
            name="assistantName"
            placeholder="e.g., My Assistant"
            required
          />
        </div>

        <div class="form-group">
          <label for="wake-word">Wake Word</label>
          <input
            id="wake-word"
            type="text"
            [(ngModel)]="wakeWord"
            name="wakeWord"
            placeholder="e.g., assistant"
            required
          />
          <small class="form-hint">The word that will trigger this assistant</small>
        </div>

        <div class="form-group">
          <label for="avatar">Avatar URL (optional)</label>
          <input
            id="avatar"
            type="text"
            [(ngModel)]="avatar"
            name="avatar"
            placeholder="assets/img/robo.webp"
          />
        </div>

        <div class="form-group">
          <label for="voice">Voice</label>
          <select
            id="voice"
            [(ngModel)]="selectedVoice"
            name="selectedVoice"
            class="voice-select"
          >
            <option
              *ngFor="let voiceOption of availableVoices"
              [value]="voiceOption.voice"
            >
              {{ voiceOption.voice }}
              <span *ngIf="!voiceOption.downloaded"> (not downloaded)</span>
            </option>
          </select>
          <small class="form-hint">Voice will be downloaded automatically when needed</small>
        </div>

        <div class="dialog-actions">
          <button type="button" class="cancel-button" (click)="closeDialog()">
            Cancel
          </button>
          <button
            type="submit"
            class="create-button"
            [disabled]="!assistantName.trim() || !wakeWord.trim()"
          >
            Create Assistant
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
