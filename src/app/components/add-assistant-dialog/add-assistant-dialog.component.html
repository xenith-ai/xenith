<div
  *ngIf="isOpen"
  class="dialog-backdrop"
  (mousedown)="onBackdropMousedown($event)"
>
  <div class="dialog-container" (mousedown)="$event.stopPropagation()">
    <div class="dialog-header">
      <h2>{{ editingAssistant ? 'Edit Assistant' : 'Add Assistant' }}</h2>
      <button class="close-button" (click)="closeDialog()">×</button>
    </div>

    <div class="dialog-content">
      <form (ngSubmit)="createAssistant()">
        <div class="form-group">
          <label for="assistant-name">Assistant Name</label>
          <input
            id="assistant-name"
            type="text"
            [(ngModel)]="assistantName"
            name="assistantName"
            placeholder="e.g. My Assistant"
            required
          />
        </div>

        <div class="form-group">
          <label for="wake-word">Wake Word</label>
          <input
            id="wake-word"
            type="text"
            [(ngModel)]="wakeWord"
            name="wakeWord"
            placeholder="e.g. assistant"
            required
          />
          <small class="form-hint">The word that will trigger this assistant</small>
        </div>

        <div class="form-group">
          <label for="avatar">Avatar URL (optional)</label>
          <input
            id="avatar"
            type="text"
            [(ngModel)]="avatarDisplay"
            name="avatar"
            placeholder=""
          />
        </div>

        <div class="form-group">
          <label for="voice">Voice</label>
          <select
            id="voice"
            [(ngModel)]="selectedVoice"
            name="selectedVoice"
            class="voice-select"
          >
            <option
              *ngFor="let voiceOption of availableVoices"
              [value]="voiceOption.voice"
            >
              {{ voiceOption.voice }}
            </option>
          </select>
          <small class="form-hint">Voice will be downloaded automatically when needed</small>
        </div>

        <div class="form-group">
          <label for="model">LLM Model</label>
          <select
            id="model"
            [(ngModel)]="selectedModel"
            name="selectedModel"
            class="model-select"
          >
            <option
              *ngFor="let modelOption of allAvailableModels"
              [value]="modelOption.id"
            >
              {{ modelOption.name }}
            </option>
          </select>
          <small class="form-hint">Model will be downloaded automatically when needed</small>
        </div>

        <div class="dialog-actions">
          <div class="dialog-actions-left">
            <button
              *ngIf="editingAssistant"
              type="button"
              class="delete-button"
              (click)="deleteAssistant()"
            >
              Delete
            </button>
          </div>
          <div class="dialog-actions-right">
            <button type="button" class="cancel-button" (click)="closeDialog()">
              Cancel
            </button>
            <button
              type="submit"
              class="create-button"
              [disabled]="!assistantName.trim() || !wakeWord.trim()"
            >
              {{ editingAssistant ? 'Update Assistant' : 'Create Assistant' }}
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
