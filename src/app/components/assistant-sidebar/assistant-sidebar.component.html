<!-- Backdrop -->
<div
  *ngIf="isOpen"
  class="sidebar-backdrop"
  (click)="closeSidebar()"
></div>

<!-- Sidebar -->
<div
  class="sidebar-container"
  [class.open]="isOpen"
  (click)="$event.stopPropagation()"
>
  <div class="sidebar-header">
    <img src="assets/favicon/favicon-32x32.png" alt="" class="sidebar-logo" />
    <h1 class="sidebar-title">xenith</h1>
    <button class="close-button" (click)="closeSidebar()">
      ×
    </button>
  </div>

  <nav class="sidebar-nav">
    <button type="button" class="sidebar-nav-link" [class.active]="showAssistants" (click)="navigateToChat(); closeSidebarOnMobile()">chat</button>
    <a routerLink="/image" class="sidebar-nav-link" routerLinkActive="active" (click)="closeSidebarOnMobile()">image</a>
    <a routerLink="/video" class="sidebar-nav-link" routerLinkActive="active" (click)="closeSidebarOnMobile()">video</a>
    <a routerLink="/audio" class="sidebar-nav-link" routerLinkActive="active" (click)="closeSidebarOnMobile()">audio</a>
    <a routerLink="/about" class="sidebar-nav-link" routerLinkActive="active" (click)="closeSidebarOnMobile()">about</a>
  </nav>

  <div class="sidebar-content" *ngIf="showAssistants">
    <div class="sidebar-section-header">
      <div class="section-title-row">
        <span
          class="listening-indicator-dot"
          [class.active]="audioService.listening"
          [class.loading]="isStartingListening"
          [title]="audioService.listening ? 'Listening active' : (isStartingListening ? 'Loading...' : 'Listening disabled')"
        ></span>
        <h3 class="sidebar-section-title">Assistants</h3>
      </div>
      <div class="section-title-actions">
        <ng-container *ngIf="isStartingListening">
          <span class="loading-models">
            <span class="spinner"></span>
            <span>Loading models...</span>
          </span>
        </ng-container>
        <ng-container *ngIf="!isStartingListening">
          <button
            *ngIf="audioService.listening"
            type="button"
            class="listening-toggle stop"
            (click)="stopListening()"
            title="Stop listening"
          >
            Stop
          </button>
          <button
            *ngIf="!audioService.listening"
            type="button"
            class="listening-toggle start"
            (click)="startListening()"
            title="Start listening"
          >
            Start
          </button>
        </ng-container>
      </div>
    </div>
    <div class="assistants-list">
      <div
        *ngFor="let assistant of assistants"
        class="assistant-item"
        [class.triggered]="isTriggered(assistant)"
        [class.selected]="isCurrentAssistant(assistant)"
        (click)="selectAssistant(assistant)"
      >
        <img
          [src]="assistant.avatar"
          [alt]="assistant.name"
          class="assistant-avatar"
        />
        <div class="assistant-info">
          <div class="assistant-name">
            {{ assistant.name }}
            <span *ngIf="isInitializing(assistant)" class="loading-indicator" title="Initializing model...">
              <span class="spinner"></span>
            </span>
          </div>
          <div class="assistant-model">{{ getModelDisplayName(assistant.modelId) }}</div>
        </div>
        <button
          class="edit-button"
          (click)="editAssistant($event, assistant)"
          title="Edit Assistant"
        >
          ⚙
        </button>
      </div>

      <div *ngIf="assistants.length === 0" class="empty-state">
        <p>No assistants yet</p>
        <p class="empty-state-hint">Add your first assistant to get started</p>
      </div>
    </div>

    <button class="add-assistant-button" (click)="addAssistant()">
      <span>+ Add Assistant</span>
    </button>
  </div>
</div>
