<div class="content-page-container" [class.centered-layout]="gifSrc">
  <div class="placeholder-page">
    <h1 class="page-title">{{ title }}</h1>
    <p class="body" *ngIf="description">{{ description }}</p>
    <img *ngIf="gifSrc" [src]="gifSrc" alt="" class="placeholder-gif" />
    <a routerLink="/about" class="back-link">← about xenith</a>
  </div>
</div>
