<div id="chat-container" class="flex flex-col">
  <div #chatMessages id="chat-messages">
    <div *ngFor="let messageGroup of conversation?.structuredMessages" class="chat-message-group flex flex-row" [class.left]="messageGroup.chatParticipant | instanceOf: AI" [class.right]="messageGroup.chatParticipant | instanceOf: User">
      <div *ngIf="messageGroup.chatParticipant | instanceOf: AI" class="avatar flex flex-col justify-center items-center">
        <img crossorigin="anonymous" src="assets/dev/miku.jpg" alt="Avatar">
      </div>
      <div class="content flex flex-col">
        <div *ngFor="let message of messageGroup.messages" class="content-item flex flex-col">
          <app-chat-message [message]="message"></app-chat-message>
        </div>
      </div>
      <div *ngIf="messageGroup.chatParticipant | instanceOf: User" class="avatar flex flex-col justify-center items-center">
        <img crossorigin="anonymous" src="assets/dev/shane.webp" alt="Avatar">
      </div>
    </div>
  </div>
  <div id="chat-input-container" class="flex flex-row items-start">
    <div class="flex h-full aspect-square justify-center align-center">
      <button id="listening-container" class="flex h-full w-auto items-center justify-center" (click)="toggleListener()">
        <img [src]="audioRecorderService.microphoneAccess ? 'assets/img/microphone.svg' : 'assets/img/no-microphone.svg'" [style.opacity]="(audioRecorderService.microphoneAccess && audioRecorderService.listening) ? 0 : 1" alt="Microphone" class="h-full w-auto">
        <div class="loader h-full w-auto" *ngIf="(audioRecorderService.microphoneAccess && audioRecorderService.listening)"></div>
        <div id="circle-gradient-container" [class.listening]="audioRecorderService.microphoneAccess && audioRecorderService.listening" [class.not-listening]="audioRecorderService.microphoneAccess && !audioRecorderService.listening" [class.microphone-disabled]="!audioRecorderService.microphoneAccess">
        </div>
      </button>
    </div>
    <input class="grow" #chatInput id="chat-input" type="text" placeholder="Start talking..." (keydown.enter)="inputOnEnter(chatInput)">
  </div>
</div>
