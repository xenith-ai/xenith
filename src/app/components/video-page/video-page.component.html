<div class="content-page-container">
  <div class="video-page">
    <div class="video-page-actions">
      <button
        type="button"
        class="download-models-btn"
        (click)="downloadModels()"
        [disabled]="downloading || modelCached"
      >
        {{ downloading ? 'Downloading…' : modelCached ? 'Models downloaded' : 'Download models' }}
      </button>
      <span *ngIf="downloading && downloadProgress != null" class="download-progress">{{ downloadProgress }}%</span>
      <p *ngIf="downloadError" class="download-error">{{ downloadError }}</p>
    </div>
    <div class="two-column-layout" *ngIf="videoPageClip">
      <div class="left-column">
        <div class="transcription-result" *ngIf="transcription">
          <p class="result-text">{{ transcription }}</p>
        </div>
      </div>
      <div class="right-column">
        <div class="video-wrapper">
          <div class="video-container">
            <video
              #videoEl
              [src]="videoObjectUrl"
              class="video-player"
              (click)="togglePlay()"
            ></video>
          </div>
          <div class="custom-controls">
            <button type="button" class="play-pause-btn" (click)="togglePlay()" [attr.aria-label]="isPaused ? 'Play' : 'Pause'">
              <span class="play-icon" *ngIf="isPaused">▶</span>
              <span class="pause-icon" *ngIf="!isPaused">❚❚</span>
            </button>
            <div
              class="track-bar"
              *ngIf="videoDuration > 0 && playIntervals.length"
              (click)="onBarClick($event)"
              role="slider"
              [attr.aria-valuenow]="currentTime"
              [attr.aria-valuemin]="0"
              [attr.aria-valuemax]="videoDuration"
            >
              <div class="track-bg"></div>
              <div
                *ngFor="let iv of playIntervals"
                class="track-interval"
                [style.left.%]="(iv.start / videoDuration) * 100"
                [style.width.%]="((iv.end - iv.start) / videoDuration) * 100"
              ></div>
              <div class="track-playhead" [style.left.%]="playheadFraction * 100"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p *ngIf="!videoPageClip" class="video-page-empty">Add clips from the sidebar to transcribe and play.</p>
  </div>
</div>
